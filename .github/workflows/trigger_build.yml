name: Trigger APK Build

on:
  # Runs after OpenCode pushes code
  workflow_run:
    workflows: ["OpenCode Agent"]
    types: [completed]

  # Manual trigger
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual trigger'

jobs:
  trigger-apk-build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Trigger APK Build In Private Repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_PRIVATE_TOKEN }}
          script: |
            const [owner, repo] = '${{ secrets.PRIVATE_REPO_NAME }}'.split('/');

            await github.rest.actions.createWorkflowDispatch({
              owner: owner,
              repo: repo,
              workflow_id: 'build.yml',
              ref: 'main'
            });

            console.log('APK build triggered in private repo!');

      - name: Notify Build Started
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('APK build has been triggered!');
