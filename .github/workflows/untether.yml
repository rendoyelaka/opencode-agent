name: Untether Agent

on:
  workflow_dispatch:
    inputs:
      keep_alive:
        description: 'Keep alive duration in minutes'
        required: false
        default: '50'
  schedule:
    - cron: '0,45 * * * *'

jobs:
  untether:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Install Untether
        run: uv tool install untether

      - name: Add uv tools to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PAT_TOKEN }}
          path: private-repo

      - name: Configure Git
        run: |
          git config --global user.email "opencode-bot@github.com"
          git config --global user.name "OpenCode Bot"

      - name: Create Untether Config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ~/.untether
          python3 << PYEOF
          import os, json
          bot_token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = int(os.environ['TELEGRAM_CHAT_ID'])
          workspace = os.environ['GITHUB_WORKSPACE']
          project_path = workspace + '/private-repo'
          lines = [
              'default_engine = "opencode"',
              '',
              '[transports.telegram]',
              f'bot_token = "{bot_token}"',
              f'chat_id = {chat_id}',
              'session_mode = "chat"',
              f'allowed_user_ids = [{chat_id}]',
              '',
              '[projects.pipeline]',
              f'path = "{project_path}"',
              'default_engine = "opencode"',
              '',
              '[cost_budget]',
              'enabled = false',
          ]
          config = '\n'.join(lines)
          with open(os.path.expanduser('~/.untether/untether.toml'), 'w') as f:
              f.write(config)
          print('Config written:')
          print(config)
          PYEOF

      - name: Configure OpenCode
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p ~/.config/opencode
          python3 << PYEOF
          import json, os
          config = {
              'providers': {
                  'openrouter': {
                      'apiKey': os.environ['OPENROUTER_API_KEY'],
                      'baseURL': 'https://openrouter.ai/api/v1'
                  }
              },
              'model': 'openrouter/nvidia/nemotron-3-ultra-550b-a55b:free'
          }
          with open(os.path.expanduser('~/.config/opencode/config.json'), 'w') as f:
              json.dump(config, f)
          print('OpenCode config written')
          PYEOF

      - name: Start Untether
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        working-directory: private-repo
        run: |
          echo "Starting Untether agent..."
          timeout 2700 untether || true
          echo "Untether session ended"

      - name: Push Any Changes
        working-directory: private-repo
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ secrets.PRIVATE_REPO_NAME }}.git
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to push"
          else
            git commit -m "OpenCode Agent: changes via Untether"
            git push origin HEAD
            echo "Changes pushed!"
          fi
