name: OpenCode Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PAT_TOKEN }}
          path: private-repo
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Configure Git
        run: |
          git config --global user.email "opencode-bot@github.com"
          git config --global user.name "OpenCode Bot"

      - name: Extract Task
        id: task
        run: |
          COMMENT="${{ github.event.comment.body }}"
          TASK=$(echo "$COMMENT" | sed 's|/oc ||g' | sed 's|/opencode ||g')
          echo "task=$TASK" >> $GITHUB_OUTPUT
          echo "Task extracted: $TASK"

      - name: Run OpenCode Agent
        working-directory: private-repo
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
        run: |
          MODELS=(
            "cognitivecomputations/dolphin-mistral-24b-venice-edition:free"
            "nousresearch/hermes-3-llama-3.1-405b:free"
            "deepseek/deepseek-r1:free"
            "nvidia/nemotron-3-ultra-550b-a55b:free"
            "minimax/minimax-m3:free"
            "z-ai/glm-5.2:free"
            "meta-llama/llama-3.3-70b-instruct:free"
          )
          SUCCESS=false
          for MODEL in "${MODELS[@]}"; do
            echo "Trying model: $MODEL"
            if opencode run --model "openrouter/$MODEL" --print "${{ steps.task.outputs.task }}" 2>/dev/null; then
              SUCCESS=true
              echo "Success with: $MODEL"
              break
            else
              echo "Failed: $MODEL"
            fi
          done
          if [ "$SUCCESS" = false ]; then
            echo "All models failed"
            exit 1
          fi

      - name: Push Changes To Private Repo
        working-directory: private-repo
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ secrets.PRIVATE_REPO_NAME }}.git
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "OpenCode task completed"
            git push origin HEAD
            echo "Changes pushed successfully!"
          fi

      - name: Post Result Comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok = '${{ job.status }}' === 'success';
            const msg = ok
              ? 'OpenCode Task Complete! Code pushed to private repo.'
              : 'OpenCode Task Failed. Check Actions tab for details.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: msg
            });
