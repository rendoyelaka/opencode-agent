name: Trigger APK Build

on:
  workflow_run:
    workflows: ["OpenCode Agent"]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual trigger'

jobs:
  trigger-apk-build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Trigger APK Build In Private Repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const repoFull = '${{ secrets.PRIVATE_REPO_NAME }}';
            const [owner, repo] = repoFull.split('/');

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: owner,
                repo: repo,
                workflow_id: 'build.yml',
                ref: 'main'
              });
              console.log('APK build triggered in: ' + repoFull);
            } catch (error) {
              console.log('Error triggering build: ' + error.message);
            }

      - name: Post Notification
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('APK build triggered successfully!');
